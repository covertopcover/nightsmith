# The model runtime, pinned. Installed by `uv pip install -r` into
# ~/.nightsmith/runtime and nothing else — see runtime.go.
#
# mlx-lm comes from a git COMMIT, never PyPI: PyPI's 0.31.3 cannot load
# Gemma 4, and fails silently (the server starts, answers /v1/models with 200,
# then times out on the first real request). It is fetched as a GitHub archive
# rather than git+https because the target Mac has no git — /usr/bin/git on a
# Mac without developer tools pops the "install command line tools" dialog.
#
# Every other line is the exact set that was installed and run on a base
# M4 / 16 GB under macOS 26.6 and 27.0 on 2026-09-19. Change one only with a
# run to cite.
