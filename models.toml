# ═══════════════════════════════════════════════════════════════════════════
#  Listed so it can be refused by name
# ═══════════════════════════════════════════════════════════════════════════
[[model]]
repo = "mlx-community/Qwen3.8-Flash-Next-4bit"
revision = "07b5dc6c54600a359b87f1e53e7adf6351c72a2c"   # pinned; main on 2026-09-19
architecture = "qwen4_exp"
params_m = 177392.8
weights_bytes = 111_519_423_247        # 111.52 GB, 22 shards
min_ram_gb = 256
default_for_ram_gb = 0                 # never a default
status = "estimate"
note = """Here to be shown crossed out. Same -4bit suffix as the 2.7 GB entry
above, 42x the size, and nothing in the name warns anyone. This row is the
argument for always printing sizes."""

  [model.thinking]
  key = "enable_thinking"
  transport = "chat_template_kwargs"
  can_disable = true
  omitting_means = "unchecked"
  send_explicitly = true
  status = "estimate"


# ═══════════════════════════════════════════════════════════════════════════
#  Families not in the table yet, recorded so the shape is not forgotten
# ═══════════════════════════════════════════════════════════════════════════
# These are why `thinking = true` cannot mean one thing across models, and why
# `nightsmith model use <arbitrary repo>` has to warn rather than assume.
[[family_note]]
family = "DeepSeek-R1 and its distills"
thinking = "always on; cannot be disabled"
consequence = "The `thinking` setting has no honest mapping. Refuse the setting rather than accept it and lie."

[[family_note]]
family = "gpt-oss"
thinking = "reasoning effort levels, not a boolean"
consequence = "`thinking = false` has no equivalent. Needs its own key shape before any gpt-oss model is listed."
