params_m = 14768.3
weights_bytes = 8_307_898_514          # 8.31 GB, 2 shards
min_ram_gb = 24
default_for_ram_gb = 24
status = "estimate"

  [model.thinking]
  key = "enable_thinking"
  transport = "chat_template_kwargs"
  can_disable = true
  omitting_means = "unchecked"
  send_explicitly = true      # safe default until the template is read
  status = "estimate"
  note = """Qwen3 uses the same key name as Gemma 4 by convention, not by
standard. The semantics of omitting it have not been read off this repo's
template, so send it explicitly and let the setup probe confirm it took."""

